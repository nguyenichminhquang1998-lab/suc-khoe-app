name: Build và đưa app lên GitHub Pages

on:
  push:
    branches:
      - main
      - claude/calorie-health-tracking-app-j9k6sl
  # Cho phép bấm chạy thủ công từ tab Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nếu có nhiều lần đẩy liên tiếp, chỉ chạy lần mới nhất.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chạy test
        run: npm test

      - name: Build
        # GitHub Pages phục vụ app ở đường dẫn con /<tên-repo>/,
        # nên phải build với BASE_PATH tương ứng.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      # enablement: tự bật GitHub Pages cho repo nếu chưa bật, đỡ phải vào Settings.
      # Repo private cần gói GitHub Pro trở lên mới dùng được Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
